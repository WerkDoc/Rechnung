    <style>html{background:#0c2340}
/*splash*/
.splash{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding-bottom:6vh;cursor:pointer;
  background:radial-gradient(120% 70% at 50% 40%, #173659 0%, #0e2442 55%, #091a31 100%);overflow:hidden;
  box-shadow:0 0 0 100vmax #091a31;           /* iOS-Web-App: deckt auch Statusleiste & Home-Balken-Bereich ab */
  transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.6,0,.2,1)}
html:has(#splash),html:has(#splash) body{background:#091a31}
.splash.out{opacity:0;transform:translateY(-7%);pointer-events:none}
/* feines Netz im Hintergrund */
.sp-net{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:spFade 1.6s ease-out 2.6s forwards}
.sp-net path{stroke:#5d8fc4;stroke-width:.6;opacity:.22;fill:none}
.sp-net circle{fill:#7fb4e6;opacity:.35}
/* Karte: weißer Punkt → Kreis → Quadrat → breite Karte (clip-path) */
.sp-wrap{position:relative;filter:drop-shadow(0 22px 40px rgba(0,0,0,.42))}
.sp-card{position:relative;width:360px;height:140px;background:#fff;border-radius:28px;overflow:hidden;
  clip-path:inset(70px 180px round 70px);animation:spCard 2.6s linear forwards}
@keyframes spCard{
  0%,4%{clip-path:inset(70px 180px round 70px);animation-timing-function:cubic-bezier(.2,.8,.3,1.2)}
  15%{clip-path:inset(4px 114px round 70px);animation-timing-function:cubic-bezier(.4,0,.2,1)}
  23%,75%{clip-path:inset(0 110px round 28px);animation-timing-function:cubic-bezier(.65,0,.25,1)}
  98%,100%{clip-path:inset(0 0 round 28px)}}
/* Icon: erst mittig & groß, dann nach links */
.sp-icon{position:absolute;left:24px;top:12px;width:100px;height:116px;overflow:visible;
  transform:translateX(106px) scale(1.12);animation:spIconMove .6s cubic-bezier(.65,0,.25,1) 1.95s forwards}
@keyframes spIconMove{to{transform:translateX(0) scale(1)}}
.sp-draw{stroke:#14284a;stroke-width:5.2;stroke-dasharray:100;stroke-dashoffset:100}
.sp-phone{animation:spDraw .85s cubic-bezier(.45,.05,.55,.95) .55s forwards}
.sp-fold{stroke-width:4.4;animation:spDraw .3s ease-out 1.15s forwards}
.sp-l1{stroke:#d7262e;stroke-width:5;animation:spDraw .28s ease-out 1.18s forwards}
.sp-l2{stroke-width:5;animation:spDraw .3s ease-out 1.26s forwards}
.sp-l3{stroke-width:5;animation:spDraw .26s ease-out 1.34s forwards}
.sp-bar{stroke-width:4.6;animation:spDraw .25s ease-out 1.35s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
/* Leuchtpunkt, der die Kontur entlangfährt */
.sp-runner{opacity:0;animation:spRun .95s linear .55s forwards}
.sp-dot{fill:#fff;stroke:#29aae1;stroke-width:1.2}
.sp-halo{fill:#29aae1;opacity:.45;filter:blur(2.5px)}
@keyframes spRun{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
/* Zahnräder ploppen auf und drehen beim Einschlag des Schlüssels */
.sp-gear{fill:#14284a;fill-rule:evenodd;transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-90deg);
  animation:spPop .42s cubic-bezier(.3,1.6,.5,1) forwards, spSpin .9s cubic-bezier(.2,.7,.3,1) 1.85s}
.sp-g1{animation-delay:1.38s,1.85s}.sp-g2{animation-delay:1.5s,1.85s;animation-direction:normal,reverse}.sp-g3{animation-delay:1.6s,1.85s}
@keyframes spPop{to{transform:scale(1) rotate(0)}}
@keyframes spSpin{from{transform:scale(1) rotate(0)}to{transform:scale(1) rotate(135deg)}}
/* Roter Schlüssel fliegt von unten links ein, schwingt aus und liegt über dem Icon */
.sp-wrench{fill:#fff;stroke:#d7262e;stroke-width:4.4}
circle.sp-wrench{stroke-width:2.4}
.sp-wr{transform-box:fill-box;transform-origin:15% 50%;opacity:0;transform:translate(-95px,-10px) rotate(-75deg) scale(.6);
  animation:spWrench .55s cubic-bezier(.2,.75,.35,1) 1.5s forwards, spRed 1s ease-in-out 3.45s}
@keyframes spWrench{0%{opacity:0;transform:translate(-95px,-10px) rotate(-75deg) scale(.6)}
  25%{opacity:1}
  70%{transform:translate(2px,0) rotate(9deg) scale(1.04)}
  85%{transform:translate(0,0) rotate(-4deg) scale(1)}
  100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes spRed{0%,100%{filter:none}45%{filter:drop-shadow(0 0 2px rgba(227,27,35,.8)) drop-shadow(0 0 5px rgba(227,27,35,.4))}}
/* Funken beim Aufsetzen */
.sp-sparks circle{fill:#ff9a3c;opacity:0;animation:spSpark .5s ease-out 1.82s forwards}
.sp-sparks circle:nth-child(odd){fill:#ffd166}
@keyframes spSpark{0%{opacity:1;transform:translate(0,0) scale(1.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
/* Schriftzug gleitet von rechts herein */
.sp-text{position:absolute;left:132px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.sp-mark{font-family:"Bricolage Grotesque","Avenir Next",-apple-system,system-ui,sans-serif;font-weight:800;font-size:37px;letter-spacing:-.035em;line-height:1;white-space:nowrap;display:flex;align-items:baseline}
.sp-mark b{font-weight:800;display:inline-block}
.sp-w1{color:#14284a}.sp-w2{color:#2f96dc}
.sp-w3{font-size:.42em;letter-spacing:0;color:#d7262e;margin-left:6px;display:inline-block}
.sp-w1,.sp-w2,.sp-w3{opacity:0;transform:translateX(70px);filter:blur(6px);animation:spSlide .55s cubic-bezier(.2,.8,.25,1) forwards}
.sp-w1{animation-delay:2.02s}.sp-w2{animation-delay:2.14s}.sp-w3{animation-delay:2.3s}
@keyframes spSlide{60%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
.sp-slogan{font-family:"Figtree",-apple-system,system-ui,sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.06em;color:#6b7686;white-space:nowrap;
  opacity:0;transform:translateY(6px);animation:spSlogan .6s ease-out 2.6s forwards}
@keyframes spSlogan{to{opacity:1;transform:none;letter-spacing:.02em}}
/* Lichtreflex über die Karte (::after) + Stern an der Oberkante */
.sp-card::after{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:55%;pointer-events:none;
  background:linear-gradient(105deg,transparent 0%,rgba(41,170,225,.06) 30%,rgba(41,170,225,.22) 46%,rgba(255,255,255,.75) 50%,rgba(41,170,225,.22) 54%,rgba(41,170,225,.06) 70%,transparent 100%);
  mix-blend-mode:multiply;transform:translateX(-110%);animation:spSheen .85s cubic-bezier(.45,0,.3,1) 3.0s forwards}
@keyframes spSheen{to{transform:translateX(200%)}}
.sp-flare{position:absolute;top:0;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff 0 9%,rgba(120,200,255,.85) 14%,rgba(41,170,225,0) 50%),
    linear-gradient(90deg,transparent 0 30%,rgba(140,210,255,.9) 50%,transparent 70% 100%) center/100% 2px no-repeat,
    linear-gradient(0deg,transparent 0 30%,rgba(140,210,255,.9) 50%,transparent 70% 100%) center/2px 100% no-repeat;
  animation:spFlare .85s cubic-bezier(.45,0,.3,1) 3.0s forwards}
@keyframes spFlare{0%{opacity:0;left:6%;transform:scale(.4) rotate(0)}15%{opacity:1}50%{transform:scale(1.15) rotate(45deg)}85%{opacity:1}100%{opacity:0;left:94%;transform:scale(.5) rotate(90deg)}}
@keyframes spFade{to{opacity:1}}
@media (max-width:384px){.sp-wrap{transform:scale(.92)}}@media (max-width:350px){.sp-wrap{transform:scale(.84)}}
@media (prefers-reduced-motion: reduce){
  .sp-card,.sp-icon,.sp-draw,.sp-gear,.sp-wr,.sp-w1,.sp-w2,.sp-w3,.sp-slogan,.sp-net{animation:none!important;clip-path:none;transform:none;opacity:1;filter:none;stroke-dashoffset:0}
  .sp-runner,.sp-sparks,.sp-flare,.sp-card::after{display:none}.sp-wrap{animation:spFade .4s ease-out both}.splash.out{transform:none}}
/*/splash*/
    </style>
